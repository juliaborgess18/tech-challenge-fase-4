[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voc-rag"
version = "0.1.0"
description = "Voice of Customer Intelligence com RAG sobre as avaliações do Olist (Tech Challenge Fase 4)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.35",
]

[project.optional-dependencies]
# SDK do provedor de LLM (Google Gemini) — ver src/voc_rag/generation/llm.py
llm = ["google-genai>=1.0"]
dev = ["pytest>=8", "ipykernel", "matplotlib"]
data = ["kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
